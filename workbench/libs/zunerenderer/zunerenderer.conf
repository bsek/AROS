##begin config
version 1.0
basename zunerenderer
libbase ZuneRendererBase
libbasetype struct IntZuneRendererBase
##end config

##begin cdef
#ifndef INTUITION_INTUITION_H
#   include <intuition/intuition.h>
#endif
#include <utility/tagitem.h>
#include <utility/hooks.h>
#include <graphics/gfx.h>
#include <graphics/rastport.h>
#include <graphics/view.h>

#include <libraries/zunerenderer.h>

#ifndef ZuneRendererBase
extern struct Library *ZuneRendererBase;
#endif
##end cdef

##begin cdefprivate
#include "src/zunerenderer_intern.h"
##end cdefprivate

