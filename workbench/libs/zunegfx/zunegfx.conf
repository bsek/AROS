void ZuneFillRectangle(struct RenderPort *rp, struct ZuneRect *rect, const struct ZuneBrush *brush) (A0, A1, A2)
void ZuneFillRectangleRounded(struct RenderPort *rp, struct ZuneRect *rect, UBYTE cornerRadius, const struct ZuneBrush *brush) (A0, A1, D0, A2)
void ZuneFillCircle(struct RenderPort *rp, struct ZunePoint *center, UBYTE radius, const struct ZuneBrush *brush) (A0, A1, D0, A2)
void ZuneDrawLine(struct RenderPort *rp, struct ZunePoint *start, struct ZunePoint *end, ULONG color) (A0, A1, A2, D0)

# Shape outlines
void ZuneDrawRectangleOutline(struct RenderPort *rp, struct ZuneRect *rect, ULONG color) (A0, A1, D0)
void ZuneDrawRectangleRoundedOutline(struct RenderPort *rp, struct ZuneRect *rect, UBYTE cornerRadius, ULONG color) (A0, A1, D0, D1)
void ZuneDrawCircleOutline(struct RenderPort *rp, struct ZunePoint *center, UBYTE radius, ULONG color) (A0, A1, D0, D1)

# Styled versions
void ZuneDrawRectangleOutlineStyled(struct RenderPort *rp, struct ZuneRect *rect, UBYTE lineWidth, ULONG color) (A0, A1, D0, D1)
void ZuneDrawCircleOutlineStyled(struct RenderPort *rp, struct ZunePoint *center, UBYTE radius, UBYTE lineWidth, ULONG color) (A0, A1, D0, D1, D2)
void ZuneDrawRectangleRoundedOutlineStyled(struct RenderPort *rp, struct ZuneRect *rect, UBYTE cornerRadius, UBYTE lineWidth, ULONG color) (A0, A1, D0, D1, D2)
