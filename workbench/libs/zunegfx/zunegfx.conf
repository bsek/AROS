##begin config
version 1.0
basename zunegfx
libbase ZuneGfxBase
libbasetype struct IntZuneGfxBase
options noautoinit
##end config

##begin cdef
#ifndef INTUITION_INTUITION_H
#   include <intuition/intuition.h>
#endif
#include <utility/tagitem.h>
#include <utility/hooks.h>
#include <graphics/gfx.h>
#include <graphics/rastport.h>
#include <graphics/view.h>

#include <libraries/zunegfx.h>

#ifndef ZuneGfxBase
extern struct Library *ZuneGfxBase;
#endif
##end cdef

##begin cdefprivate
#include "src/zunegfx_intern.h"
##end cdefprivate

##begin functionlist
# RenderPort Management (Window-centric API)
struct RenderPort *CreateRenderPortForWindow(struct Window *window, struct ColorMap *colormap, UWORD backend_type) (A0, A1, D0)
struct DrawingBoard *CreateDrawingBoardForRenderPort(struct RenderPort *rp, UWORD width, UWORD height, ULONG flags) (A0, D0, D1, D2)
void DestroyRenderPort(struct RenderPort *rp) (A0)
void ClearRenderPort(struct RenderPort *rp, ULONG color) (A0, D0)

# DrawingBoard Management
BOOL ZuneSetTarget(struct RenderPort *rp, struct DrawingBoard *board) (A0, A1)
void DestroyDrawingBoard(struct RenderPort *rp, struct DrawingBoard *board) (A0, A1)
void ClearDrawingBoard(struct RenderPort *rp, ULONG color) (A0, D0)

# Direct Pixel Access
APTR LockDrawingBoardPixels(struct RenderPort *rp, ULONG *pitch) (A0, A1)
void UnlockDrawingBoardPixels(struct RenderPort *rp) (A0)
ULONG GetPixel(struct RenderPort *rp, struct ZunePoint *point) (A0, A1)
void SetPixel(struct RenderPort *rp, struct ZunePoint *point, ULONG color) (A0, A1, D0)

# Performance and Batching
void BeginBatch(struct RenderPort *rp) (A0)
void EndBatch(struct RenderPort *rp) (A0)
void FlushBatch(struct RenderPort *rp) (A0)
BOOL IsBatchingEnabled(struct RenderPort *rp) (A0)
ULONG GetBatchCount(struct RenderPort *rp) (A0)

# Blitting and Surface Operations
void ZuneBlit(struct RenderPort *src_rp, struct RenderPort *dst_rp, WORD src_x, WORD src_y, WORD dst_x, WORD dst_y, UWORD width, UWORD height) (A0, A1, D0, D1, D2, D3, D4, D5)
void ZunePresent(struct RenderPort *rp, WORD src_x, WORD src_y, WORD dst_x, WORD dst_y, UWORD width, UWORD height) (A0, D0, D1, D2, D3, D4, D5)

# Clipping
BOOL ZuneSetClipRegion(struct RenderPort *rp, struct Region *region) (A0, A1);
void ZuneClearClipRegion(struct RenderPort *rp) (A0);
struct Region *ZuneCombineRegions(struct Region *r1, struct Region *r2, UBYTE operation) (A0, A1, D0);

# Color Utilities
ULONG RGBToColor(UBYTE r, UBYTE g, UBYTE b) (D0, D1, D2)
ULONG ARGBToColor(UBYTE a, UBYTE r, UBYTE g, UBYTE b) (D0, D1, D2, D3)
ULONG BlendColors(ULONG color1, ULONG color2, UBYTE alpha) (D0, D1, D2)

