# Pixels
void ZuneDrawPixel(struct RenderPort *rp, struct ZunePoint *point, ULONG color) (A0, A1, D0)

# Circles AA
void ZuneDrawCircleAA(struct RenderPort *rp, struct ZunePoint *center, UBYTE radius, ULONG color) (A0, A1, D0, D1)
void ZuneFillCircleAA(struct RenderPort *rp, struct ZunePoint *center, UWORD radius, const struct ZuneBrush *brush) (A0, A1, D0, A2)
void ZuneDrawCircleOutlineStyledAA(struct RenderPort *rp, struct ZunePoint *center, UWORD radius, UBYTE borderWidth, ULONG color) (A0, A1, D0, D1, D2)
void ZuneFillCircleStyledAA(struct RenderPort *rp, struct ZunePoint *center, UWORD radius, UBYTE borderWidth, const struct ZuneBrush *brush, ULONG borderColor) (A0, A1, D0, D1, A2, D2)

# AA Quality
void ZuneSetAntialiasingQuality(struct RenderPort *rp, UBYTE quality) (A0, D0)
UBYTE ZuneGetAntialiasingQuality(struct RenderPort *rp) (A0)

# Rounded rectangles AA
void ZuneFillRectangleRoundedAA(struct RenderPort *rp, struct ZuneRect *rect, UBYTE cornerRadius, const struct ZuneBrush *brush) (A0, A1, D0, A2)
void ZuneFillRectangleRoundedStyledAA(struct RenderPort *rp, struct ZuneRect *rect, UBYTE cornerRadius, UBYTE borderWidth, const struct ZuneBrush *brush, ULONG borderColor) (A0, A1, D0, D1, A2, D2)
void ZuneDrawRectangleRoundedOutlineStyledAA(struct RenderPort *rp, struct ZuneRect *rect, UBYTE cornerRadius, UBYTE lineWidth, ULONG borderColor) (A0, A1, D0, D1, D2)
void ZuneDrawRectangleRoundedOutlineAA(struct RenderPort *rp, struct ZuneRect *rect, UBYTE cornerRadius, ULONG color) (A0, A1, D0, D1)

# Lines AA
void ZuneDrawLineAA(struct RenderPort *rp, struct ZunePoint *start, struct ZunePoint *end, ULONG color) (A0, A1, A2, D0)
void ZuneDrawLineStyledAA(struct RenderPort *rp, struct ZunePoint *start, struct ZunePoint *end, UBYTE width, ULONG color) (A0, A1, A2, D0, D1)

# Texture Management
struct ZuneTexture *CreateTexture(struct RenderPort *rp, UWORD width, UWORD height, UBYTE depth, ULONG format, ULONG flags) (A0, D0, D1, D2, D3, D4)
struct ZuneTexture *CreateTextureFromData(struct RenderPort *rp, APTR data, UWORD width, UWORD height, UBYTE depth, ULONG format, ULONG pitch, ULONG flags) (A0, A1, D0, D1, D2, D3, D4, D5)
struct ZuneTexture *CreateTextureFromDrawingBoard(struct RenderPort *rp, ULONG flags) (A0, D0)
struct ZuneTexture *CreateTextureFromDatatype(struct RenderPort *rp, APTR dt_object, ULONG flags) (A0, A1, D0)
struct ZuneTexture *CreateTextureFromFile(struct RenderPort *rp, CONST_STRPTR filename, struct Screen *screen, ULONG flags) (A0, A1, A2, D0)
void DestroyTexture(struct RenderPort *rp, struct ZuneTexture *texture) (A0, A1)

# Texture Data Operations
BOOL UpdateTextureData(struct RenderPort *rp, struct ZuneTexture *texture, APTR data, struct ZuneRect *rect) (A0, A1, A2, A3)
APTR LockTexturePixels(struct RenderPort *rp, struct ZuneTexture *texture, ULONG *pitch) (A0, A1, A2)
void UnlockTexturePixels(struct RenderPort *rp, struct ZuneTexture *texture) (A0, A1)
ULONG GetTexturePixel(struct RenderPort *rp, struct ZuneTexture *texture, struct ZunePoint *point) (A0, A1, A2)
void SetTexturePixel(struct RenderPort *rp, struct ZuneTexture *texture, struct ZunePoint *point, ULONG color) (A0, A1, A2, D0)

# Texture Rendering
void ZuneDrawTexture(struct RenderPort *rp, struct ZuneTexture *texture, struct ZunePoint *position) (A0, A1, A2)
void ZuneDrawTextureScaled(struct RenderPort *rp, struct ZuneTexture *texture, struct ZuneRect *dest_rect) (A0, A1, A2)
void ZuneDrawTextureRegion(struct RenderPort *rp, struct ZuneTexture *texture, struct ZuneRect *src_rect, struct ZuneRect *dest_rect) (A0, A1, A2, A3)
void ZuneDrawTextureTinted(struct RenderPort *rp, struct ZuneTexture *texture, struct ZunePoint *position, ULONG tint_color) (A0, A1, A2, D0)
void ZuneDrawTextureScaledTinted(struct RenderPort *rp, struct ZuneTexture *texture, struct ZuneRect *dest_rect, ULONG tint_color) (A0, A1, A2, D0)
void ZuneDrawTextureRegionTinted(struct RenderPort *rp, struct ZuneTexture *texture, struct ZuneRect *src_rect, struct ZuneRect *dest_rect, ULONG tint_color) (A0, A1, A2, A3, D0)
void ZuneDrawTextureTiled(struct RenderPort *rp, struct ZuneTexture *texture, struct ZuneRect *dest_rect) (A0, A1, A2)

# Texture utilities
BOOL ZuneIsTextureValid(struct ZuneTexture *texture) (A0);

# Clipping utilities
struct Region *ZuneCreateCircleRegion(struct ZunePoint *center, WORD radius) (A0, D0);
struct Region *ZuneCreateRoundedRectRegion(struct ZuneRect *rect, WORD corner_radius) (A0, D0);

# Cache utilities
void ZuneInitPenCache(struct RenderPort *rp, LONG *pens, UWORD count) (A0, A1, D0);

# Capture from RastPort to DrawingBoard (for reading background)
