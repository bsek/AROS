##begin config
version 1.0
basename zunegfx
libbase ZuneGfxBase
libbasetype struct IntZuneGfxBase
options noautoinit
##end config

##begin cdef
#ifndef INTUITION_INTUITION_H
#   include <intuition/intuition.h>
#endif
#include <utility/tagitem.h>
#include <utility/hooks.h>
#include <graphics/gfx.h>
#include <graphics/rastport.h>
#include <graphics/view.h>

#include <libraries/zunegfx.h>

#ifndef ZuneGfxBase
extern struct Library *ZuneGfxBase;
#endif

struct LayerCompositor;
struct CompositorWindow;
##end cdef

##begin cdefprivate
#include "src/zunegfx_intern.h"
##end cdefprivate

